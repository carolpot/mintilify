<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deep Intelligence</title>
<style>
html, body { margin: 0; padding: 0; background: #ffffff; }
@media (prefers-color-scheme: dark) { html, body { background: #1a1a1a; } }

.di-page {
  padding: 0 24px 32px;
  --bg: #ffffff;
  --bg-subtle: #F6F6F6;
  --bg-card: #ffffff;
  --ink: #141414;
  --ink-muted: #8B8B8B;
  --ink-dim: #5A5A6A;
  --ink-light: #6A6A7A;
  --ink-faint: #9A9AAA;
  --ink-ghost: #C0C0CC;
  --border: #ECECEC;
  --border-soft: #F4F4F6;
  --purple: #863FFF;
  --purple-50: #ECE2FF;
  --purple-200: #BE97FF;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.6;
}
html.dark .di-page {
  --bg: #1a1a1a;
  --bg-subtle: #222222;
  --bg-card: #1e1e1e;
  --ink: #f0f0f0;
  --ink-muted: #9A9AAA;
  --ink-dim: #8A8A9A;
  --ink-light: #7A7A8A;
  --ink-faint: #5A5A6A;
  --ink-ghost: #4A4A5A;
  --border: #2e2e2e;
  --border-soft: #252525;
  --purple-50: #2d1f4a;
  background: #1a1a1a;
}

.di-page .di-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 16px; flex-wrap: wrap; }
.di-page .di-eyebrow-row { font-size: 13px; color: var(--ink-muted); }

.di-page .view-toggle { display: flex; flex-shrink: 0; background: var(--bg-subtle); border-radius: 999px; padding: 3px; gap: 2px; }
.di-page .vtog-btn { display: flex; align-items: center; gap: 5px; padding: 7px 16px; border-radius: 999px; border: none; background: transparent; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--ink-muted); cursor: pointer; transition: all 0.15s; white-space: nowrap; line-height: 1; }
.di-page .vtog-btn:hover:not(.active) { color: var(--ink); background: transparent; }
.di-page .vtog-btn.active { background: var(--purple); color: #fff; }

.di-page .hero { padding: 32px 0 28px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.di-page .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--purple); margin-bottom: 14px; }
.di-page .eyebrow::before { content: ''; display: block; width: 16px; height: 1.5px; background: currentColor; }
.di-page .hero h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; color: var(--ink); margin: 0 0 12px; }
.di-page .lead { font-size: 15px; color: var(--ink-muted); line-height: 1.65; max-width: 620px; margin: 0; }

.di-page .view { padding-bottom: 40px; }

.di-page .section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.di-page .section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--purple); }
.di-page .section-count { font-size: 11px; color: var(--ink-ghost); }

.di-page .cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 36px; }
.di-page .card { padding: 22px 24px; border: 1px solid var(--border); border-radius: 16px; background: var(--bg-card); transition: border-color 0.15s; }
.di-page .card:hover { border-color: var(--purple-200); }
.di-page .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.di-page .card-name { font-size: 18px; font-weight: 700; letter-spacing: -0.015em; color: var(--ink); line-height: 1.2; }
.di-page .type-badge { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
.di-page .badge-rec { background: var(--purple-50); color: var(--purple); }
.di-page .badge-score { background: #FEF3E0; color: #92400E; }
.di-page .badge-bc { background: #E9ECFF; color: #3A3A9A; }
html.dark .di-page .badge-score { background: #2d1e08; color: #d97706; }
html.dark .di-page .badge-bc { background: #1c1e3a; color: #a5acff; }
.di-page .card-desc { font-size: 13px; color: var(--ink-dim); line-height: 1.6; margin-bottom: 18px; max-width: 680px; }
.di-page .card-body { display: block; padding-top: 18px; border-top: 1px solid var(--border); }

.di-page .col-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #B8B8C4; margin-bottom: 10px; }
html.dark .di-page .col-label { color: #5A5A6A; }
.di-page .plat-section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #B8B8C4; margin-top: 14px; }
html.dark .di-page .plat-section-label { color: #5A5A6A; }

.di-page .plat-grid { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 18px; }
.di-page .plat-badge { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 9px; border-radius: 7px; border: 1px solid var(--border); min-width: 72px; text-align: center; }
.di-page .plat-badge-name { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9A9AAA; }
.di-page .plat-badge-val { font-size: 10.5px; font-weight: 600; }
.di-page .plat-live { background: #DCFCE7; border-color: #BBF7D0; }
.di-page .plat-live .plat-badge-val { color: #166534; }
.di-page .plat-planned { background: #FEF3E0; border-color: #FDE68A; }
.di-page .plat-planned .plat-badge-val { color: #92400E; }
.di-page .plat-ni { background: var(--bg-subtle); border-color: #E8E8F0; }
.di-page .plat-ni .plat-badge-val { color: var(--ink-faint); }
.di-page .plat-irrel { background: var(--bg); border-color: #F0F0F4; }
.di-page .plat-irrel .plat-badge-val { color: var(--ink-ghost); }
html.dark .di-page .plat-live { background: #0a2e18; border-color: #166534; }
html.dark .di-page .plat-live .plat-badge-val { color: #4ade80; }
html.dark .di-page .plat-planned { background: #2d1e08; border-color: #92400e; }
html.dark .di-page .plat-planned .plat-badge-val { color: #fbbf24; }
html.dark .di-page .plat-ni { border-color: var(--border); }
html.dark .di-page .plat-irrel { border-color: var(--border-soft); }

.di-page .ep-list { display: flex; flex-direction: column; gap: 6px; }
.di-page .ep-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg-subtle); border-radius: 8px; }
.di-page .ep-method { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--purple-50); color: var(--purple); font-family: ui-monospace, monospace; letter-spacing: 0.04em; flex-shrink: 0; }
.di-page .ep-path { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.di-page .ep-beta { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: #FEF3E0; color: #92400E; text-transform: uppercase; flex-shrink: 0; }
html.dark .di-page .ep-beta { background: #2d1e08; color: #d97706; }
.di-page .ep-empty { padding: 12px 14px; background: var(--bg-subtle); border: 1px dashed #D8D8E0; border-radius: 8px; }
html.dark .di-page .ep-empty { border-color: #3a3a4a; }
.di-page .ep-empty-title { font-size: 12.5px; font-weight: 600; color: var(--ink-dim); margin-bottom: 2px; }
.di-page .ep-empty-sub { font-size: 11px; color: var(--ink-faint); }

.di-page .api-note { padding: 14px 18px; background: var(--purple-50); border-left: 3px solid var(--purple); border-radius: 0 10px 10px 0; font-size: 13px; color: #3A3A5A; line-height: 1.6; }
html.dark .di-page .api-note { color: #c0b0e0; }
.di-page .api-note code { font-family: ui-monospace, monospace; font-size: 12px; background: rgba(134,63,255,0.12); padding: 1px 4px; border-radius: 3px; color: var(--purple); }

.di-page .machine-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
.di-page .machine-meta-text { font-size: 12px; color: var(--ink-muted); }
.di-page .machine-meta-count { font-size: 12px; color: var(--ink-ghost); background: var(--bg-subtle); padding: 4px 10px; border-radius: 999px; }
.di-page .machine-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: auto; }
.di-page .machine-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.di-page .machine-tbl thead tr { background: var(--bg-subtle); border-bottom: 1px solid var(--border); }
.di-page .machine-tbl th { padding: 9px 12px; text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A9AAA; white-space: nowrap; }
.di-page .machine-tbl th:first-child { padding-left: 16px; }
.di-page .machine-tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
.di-page .machine-tbl td:first-child { padding-left: 16px; }
.di-page .machine-tbl tr:last-child td { border-bottom: none; }
.di-page .machine-tbl tbody tr:hover td { background: var(--bg-subtle); }
.di-page .mt-name { font-weight: 600; color: var(--ink); white-space: nowrap; font-size: 13px; }
.di-page .mt-badge { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 2px 8px; border-radius: 4px; white-space: nowrap; background: var(--bg-subtle); color: var(--ink-light); }
.di-page .mt-desc { font-size: 12px; color: var(--ink-light); line-height: 1.5; max-width: 280px; }
.di-page .mt-ep { font-family: ui-monospace, monospace; font-size: 11px; color: #5A4ABA; line-height: 1.7; white-space: nowrap; }
html.dark .di-page .mt-ep { color: #a590ff; }
.di-page .mt-ep-none { font-size: 11px; color: var(--ink-ghost); font-style: italic; white-space: nowrap; }
.di-page .mt-ep-beta { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; background: #FEF3E0; color: #92400E; text-transform: uppercase; vertical-align: middle; margin-left: 4px; }
html.dark .di-page .mt-ep-beta { background: #2d1e08; color: #fbbf24; }
.di-page .mp-live { font-size: 10px; font-weight: 700; color: #166534; padding: 1px 5px; border-radius: 3px; background: #DCFCE7; display: inline-block; }
.di-page .mp-plan { font-size: 10px; font-weight: 700; color: #92400E; padding: 1px 5px; border-radius: 3px; background: #FEF3E0; display: inline-block; }
.di-page .mp-ni { font-size: 10px; color: var(--ink-ghost); }
.di-page .mp-irrel { font-size: 10px; color: var(--ink-ghost); opacity: 0.5; }
html.dark .di-page .mp-live { background: #0a2e18; color: #4ade80; }
html.dark .di-page .mp-plan { background: #2d1e08; color: #fbbf24; }

.di-page .tip { position: relative; display: inline-flex; align-items: center; cursor: help; border-bottom: 1px dotted #B0B0C0; }
.di-page .tip::after {
  content: attr(data-tip); position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%);
  background: #141414; color: #fff; font-size: 11.5px; font-weight: 400; line-height: 1.5;
  padding: 7px 11px; border-radius: 7px; white-space: nowrap; pointer-events: none; opacity: 0;
  transition: opacity 0.15s 0.1s; z-index: 200;
}
.di-page .tip:hover::after { opacity: 1; }

.di-loading { padding: 40px; text-align: center; color: #8B8B8B; font-family: -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="root" class="di-loading">Loading Deep Intelligence…</div>

<script>
(function () {
  function applyTheme() {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  }
  applyTheme();
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  var PLAT_LABELS = [
    { key: 'api', label: 'API', tip: null },
    { key: 'mcp', label: 'MCP', tip: null },
    { key: 'wsE', label: 'WS Enrich', tip: 'Workspace Enrichment' },
    { key: 'wsS', label: 'WS Search', tip: 'Workspace Search' },
    { key: 'apiS', label: 'API Search', tip: null },
  ];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function platBadgeClass(s) { return s === 'Live' ? 'plat-live' : s === 'Planned' ? 'plat-planned' : s === 'Irrelevant' ? 'plat-irrel' : 'plat-ni'; }
  function platBadgeText(s) { return s === 'Live' ? 'Live' : s === 'Planned' ? 'Planned' : s === 'Irrelevant' ? 'N/A' : s === 'Not Implemented' ? 'Not impl.' : '—'; }
  function platCellClass(s) { return s === 'Live' ? 'mp-live' : s === 'Planned' ? 'mp-plan' : s === 'Irrelevant' ? 'mp-irrel' : 'mp-ni'; }
  function platCellText(s) { return s === 'Live' ? 'Live' : s === 'Planned' ? 'Plan.' : s === 'Irrelevant' ? 'N/A' : '—'; }
  function typeBadgeClass(t) { return t === 'Recommendation' ? 'badge-rec' : t === 'Buying Committee' ? 'badge-bc' : 'badge-score'; }

  var DATA = null;
  var state = { view: 'human' };
  try { var saved = localStorage.getItem('di-view'); if (saved === 'human' || saved === 'machine') state.view = saved; } catch (e) {}

  function renderPlatBadges(featureName) {
    var pl = DATA.plat[featureName] || {};
    var badges = PLAT_LABELS.filter(function (p) { return pl[p.key] != null; }).map(function (p) {
      var s = pl[p.key];
      return '<div class="plat-badge ' + platBadgeClass(s) + (p.tip ? ' tip' : '') + '"' + (p.tip ? ' data-tip="' + esc(p.tip) + '"' : '') + '>' +
        '<span class="plat-badge-name">' + esc(p.label) + '</span><span class="plat-badge-val">' + esc(platBadgeText(s)) + '</span></div>';
    }).join('');
    return '<div class="plat-grid">' + badges + '</div>';
  }

  function renderCard(f) {
    var epsHtml;
    if (f.eps && f.eps.length > 0) {
      epsHtml = '<div class="ep-list">' + f.eps.map(function (ep) {
        return '<div class="ep-row"><span class="ep-method">' + esc(ep.method) + '</span><span class="ep-path">' + esc(ep.path) + '</span>' +
          (ep.beta ? '<span class="ep-beta">Beta</span>' : '') + '</div>';
      }).join('') + '</div>';
    } else {
      epsHtml = '<div class="ep-empty"><div class="ep-empty-title">Not yet available via API</div><div class="ep-empty-sub">Currently surfaced in the Lusha dashboard only.</div></div>';
    }
    return '<div class="card">' +
      '<div class="card-head"><span class="type-badge ' + typeBadgeClass(f.type) + '">' + esc(f.type) + '</span><span class="card-name">' + esc(f.name) + '</span></div>' +
      '<p class="card-desc">' + esc(f.desc) + '</p>' +
      '<div class="plat-section-label">Platform availability</div>' + renderPlatBadges(f.name) +
      '<div class="card-body"><div class="col-label">Available in</div>' + epsHtml + '</div>' +
      '</div>';
  }

  function renderHuman() {
    var recs = DATA.features.filter(function (f) { return f.type === 'Recommendation'; });
    var bc = DATA.features.filter(function (f) { return f.type === 'Buying Committee'; });
    var scores = DATA.features.filter(function (f) { return f.type === 'Score Function'; });
    return '<div class="view">' +
      '<div class="section-head"><span class="section-title">Recommendation engines</span><span class="section-count">' + recs.length + ' features</span></div>' +
      '<div class="cards">' + recs.map(renderCard).join('') + '</div>' +
      '<div class="section-head"><span class="section-title">Buying Committee</span><span class="section-count">' + bc.length + ' features</span></div>' +
      '<div class="cards">' + bc.map(renderCard).join('') + '</div>' +
      '<div class="section-head"><span class="section-title">Predictive models</span><span class="section-count">' + scores.length + ' features</span></div>' +
      '<div class="cards">' + scores.map(renderCard).join('') + '</div>' +
      '<div class="api-note">All endpoints are under <code>https://api.lusha.com</code> and require an <code>api_key</code> header.</div>' +
      '</div>';
  }

  function renderMachine() {
    var platKeys = ['api', 'mcp', 'wsE', 'wsS', 'apiS'];
    var rows = DATA.features.map(function (f) {
      var isRec = f.type === 'Recommendation';
      var pl = DATA.plat[f.name] || {};
      var epCell;
      if (f.eps && f.eps.length > 0) {
        epCell = f.eps.map(function (e) {
          return esc(e.method) + ' ' + esc(e.path) + (e.beta ? '<span class="mt-ep-beta">beta</span>' : '');
        }).join('<br/>');
        epCell = '<span class="mt-ep">' + epCell + '</span>';
      } else {
        epCell = '<span class="mt-ep-none">Dashboard only</span>';
      }
      var platCells = platKeys.map(function (k) {
        var s = pl[k];
        if (s == null) return '<td></td>';
        return '<td style="text-align:center"><span class="' + platCellClass(s) + '">' + esc(platCellText(s)) + '</span></td>';
      }).join('');
      return '<tr>' +
        '<td class="mt-name">' + esc(f.name) + '</td>' +
        '<td><span class="mt-badge">' + esc(f.type) + '</span></td>' +
        '<td class="mt-desc">' + esc(f.desc) + '</td>' +
        '<td style="text-align:right;font-size:12px;font-variant-numeric:tabular-nums">' + (f.fillRate !== null ? f.fillRate + '%' : '—') + '</td>' +
        '<td>' + (f.dataFreshness ? '<span style="font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg-subtle);color:var(--ink-light)">' + esc(f.dataFreshness) + '</span>' : '<span style="color:var(--ink-ghost);font-size:11px">—</span>') + '</td>' +
        '<td>' + epCell + '</td>' +
        platCells +
        '</tr>';
    }).join('');
    return '<div class="view">' +
      '<div class="machine-meta"><span class="machine-meta-text">All features. No dropdowns. Coverage figures are illustrative placeholders.</span><span class="machine-meta-count">' + DATA.features.length + ' features</span></div>' +
      '<div class="machine-wrap"><table class="machine-tbl"><thead><tr>' +
        '<th>Feature</th><th>Type</th><th>Description</th><th style="text-align:right">Fill rate</th><th>Refresh</th><th>Endpoints</th>' +
        '<th style="text-align:center">API</th><th style="text-align:center">MCP</th>' +
        '<th style="text-align:center"><span class="tip" data-tip="Workspace Enrichment">WS Enrich</span></th>' +
        '<th style="text-align:center"><span class="tip" data-tip="Workspace Search">WS Search</span></th>' +
        '<th style="text-align:center">API Search</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '</div>';
  }

  function render() {
    var body = state.view === 'human' ? renderHuman() : renderMachine();
    var html = '<div class="di-page">' +
      '<div class="di-header">' +
        '<span class="di-eyebrow-row">Deep Intelligence</span>' +
        '<div class="view-toggle" role="group" aria-label="View mode">' +
          '<button class="vtog-btn' + (state.view === 'human' ? ' active' : '') + '" data-view="human">Human</button>' +
          '<button class="vtog-btn' + (state.view === 'machine' ? ' active' : '') + '" data-view="machine">Machine</button>' +
        '</div>' +
      '</div>' +
      '<div class="hero">' +
        '<div class="eyebrow">Deep Intelligence</div>' +
        '<h1>Scoring &amp; recommendations</h1>' +
        '<p class="lead">Deep Intelligence pairs your data with AI to deliver recommendations, buying committee identification, and predictive scores tailored to your ICP.</p>' +
      '</div>' +
      body +
    '</div>';
    document.getElementById('root').className = '';
    document.getElementById('root').innerHTML = html;
    wireEvents();
  }

  function wireEvents() {
    document.querySelectorAll('[data-view]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.view = btn.getAttribute('data-view');
        try { localStorage.setItem('di-view', state.view); } catch (e) {}
        render();
      });
    });
  }

  try {
    DATA = JSON.parse(document.getElementById('di-data').textContent);
    render();
  } catch (err) {
    document.getElementById('root').innerHTML = '<div class="di-loading">Could not load Deep Intelligence data (' + esc(err.message) + ').</div>';
  }
})();
</script>
</body>
</html>
