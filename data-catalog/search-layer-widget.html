<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search Layer</title>
<style>
html, body { margin: 0; padding: 0; background: #ffffff; }
@media (prefers-color-scheme: dark) { html, body { background: #1a1a1a; } }

.sl-page {
  padding: 0 24px 32px;
  --bg: #ffffff;
  --bg-subtle: #F6F6F6;
  --bg-subtle2: #FAFAFD;
  --bg-panel: #FAFAFD;
  --ink: #141414;
  --ink-muted: #8B8B8B;
  --ink-dim: #6A6A7A;
  --ink-light: #9A9AAA;
  --ink-ghost: #C0C0CC;
  --border: #ECECEC;
  --border-soft: #F0F0F4;
  --border-row: #F4F4F6;
  --purple: #863FFF;
  --purple-50: #ECE2FF;
  --purple-200: #BE97FF;
  --blue: #3A91FF;
  --blue-50: #E9ECFF;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.6;
}
html.dark .sl-page {
  --bg: #1a1a1a;
  --bg-subtle: #222222;
  --bg-subtle2: #1e1e1e;
  --bg-panel: #1c1c1c;
  --ink: #f0f0f0;
  --ink-muted: #9A9AAA;
  --ink-dim: #8A8A9A;
  --ink-light: #6A6A7A;
  --ink-ghost: #4A4A5A;
  --border: #2e2e2e;
  --border-soft: #252525;
  --border-row: #252525;
  --purple-50: #2d1f4a;
  background: #1a1a1a;
}

/* Header */
.sl-page .sl-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border);
  gap: 16px; flex-wrap: wrap;
}
.sl-page .sl-eyebrow-row { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-muted); }

/* View toggle */
.sl-page .view-toggle {
  display: flex; flex-shrink: 0;
  background: var(--bg-subtle); border-radius: 999px; padding: 3px; gap: 2px;
}
.sl-page .vtog-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 7px 16px; border-radius: 999px;
  border: none; background: transparent;
  font-family: inherit; font-size: 13px; font-weight: 500;
  color: var(--ink-muted); cursor: pointer;
  transition: all 0.15s; white-space: nowrap; line-height: 1;
}
.sl-page .vtog-btn:hover:not(.active) { color: var(--ink); background: transparent; }
.sl-page .vtog-btn.active { background: var(--purple); color: #fff; }

/* Hero */
.sl-page .hero { padding: 32px 0 0; margin-bottom: 32px; }
.sl-page .hero::after { content: ''; display: block; height: 1px; background: var(--border); margin-top: 32px; }
.sl-page .eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink); margin-bottom: 14px;
}
.sl-page .hero h1 {
  font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15;
  color: var(--ink); margin: 0 0 12px;
}
.sl-page .lead {
  font-size: 15px; color: var(--ink); line-height: 1.65; max-width: 640px; margin: 0;
}

/* View */
.sl-page .view { padding-bottom: 40px; }

/* Description block */
.sl-page .desc-block {
  display: flex; flex-direction: column; gap: 24px;
  padding: 28px 0 32px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
}
.sl-page .desc-body p { font-size: 15px; color: var(--ink); line-height: 1.7; margin: 0; }
.sl-page .desc-body p + p { margin-top: 12px; }
.sl-page .desc-body code {
  font-family: ui-monospace, monospace; font-size: 13px;
  background: rgba(134,63,255,0.08); color: var(--purple);
  padding: 1px 5px; border-radius: 3px;
}
.sl-page .desc-sidebar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 700px) { .sl-page .desc-sidebar { grid-template-columns: 1fr; } }
.sl-page .desc-pill {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border: none; border-radius: 12px; background: var(--bg-subtle);
}
.sl-page .desc-pill-text { display: flex; flex-direction: column; gap: 3px; }
.sl-page .desc-pill-title { font-size: 14px; font-weight: 600; color: var(--ink); }
.sl-page .desc-pill-sub { font-size: 13px; color: var(--ink); line-height: 1.5; }
.sl-page .desc-pill-sub code { font-family: ui-monospace, monospace; font-size: 12px; background: rgba(134,63,255,0.08); color: var(--purple); padding: 1px 4px; border-radius: 3px; }
.sl-page .desc-pill-sub a { color: var(--purple); text-decoration: none; font-weight: 500; }
.sl-page .desc-pill-sub a:hover { text-decoration: underline; }

/* Highlights */
.sl-page .highlights { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 28px; }
@media (max-width: 900px) { .sl-page .highlights { grid-template-columns: repeat(2, 1fr); } }
.sl-page .highlight { padding: 16px 18px 16px 0; }
.sl-page .hl-num { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: var(--ink); margin-bottom: 5px; }
.sl-page .hl-label { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; color: var(--purple); margin-bottom: 6px; }
.sl-page .hl-desc { font-size: 13px; color: var(--ink); line-height: 1.5; }

/* Filter bar */
.sl-page .table-sticky-header { position: sticky; top: 0; z-index: 20; }
.sl-page .filterbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 16px; background: var(--bg-subtle);
  border: 1px solid var(--border); border-radius: 12px 12px 0 0; border-bottom: none;
}
.sl-page .search-input {
  flex: 1; min-width: 180px; padding: 7px 12px; font-size: 13px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--ink); outline: none; font-family: inherit;
}
.sl-page .search-input:focus { border-color: var(--purple-200); }
.sl-page .chip-group { display: flex; gap: 4px; align-items: center; }
.sl-page .chip-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #ACACBC; margin-right: 2px; }
.sl-page .chip {
  padding: 5px 11px; border-radius: 8px; font-size: 12px; font-weight: 500;
  cursor: pointer; border: 1px solid var(--border); background: var(--bg);
  color: #6A6A7A; transition: all 0.12s; font-family: inherit; white-space: nowrap;
}
.sl-page .chip:hover { border-color: var(--purple-200); color: var(--purple); }
.sl-page .chip.active { background: var(--purple-50); border-color: var(--purple-200); color: var(--purple); font-weight: 600; }
html.dark .sl-page .chip { background: var(--bg-subtle); color: var(--ink-dim); }
html.dark .sl-page .chip-label { color: #6A6A7A; }

/* Field col header */
.sl-page .field-col-header {
  display: grid; grid-template-columns: minmax(0,1.1fr) 88px minmax(0,1fr) 76px 72px 84px 18px;
  gap: 20px; padding: 7px 16px; background: var(--bg-subtle); border-bottom: 1px solid var(--border-soft);
}
.sl-page .field-col-header span { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #ACACBC; white-space: nowrap; }
html.dark .sl-page .field-col-header span { color: #5A5A6A; }
@media (max-width: 900px) {
  .sl-page .field-col-header { grid-template-columns: minmax(0,1.2fr) 60px 50px 16px; }
  .sl-page .field-col-header span:nth-child(3), .sl-page .field-col-header span:nth-child(4), .sl-page .field-col-header span:nth-child(5) { display: none; }
}

/* Field panel */
.sl-page .field-panel { border: 1px solid var(--border); border-radius: 0 0 12px 12px; }
.sl-page .cat-group { border-bottom: 1px solid var(--border-soft); }
.sl-page .cat-group:last-child { border-bottom: none; border-radius: 0 0 12px 12px; overflow: hidden; }
.sl-page .cat-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg-panel); cursor: pointer; transition: background 0.12s; }
.sl-page .cat-header:hover { background: var(--bg-subtle); }
.sl-page .cat-name { font-size: 12.5px; font-weight: 600; color: var(--ink); flex: 1; }
.sl-page .cat-count-paren { font-size: 11px; color: var(--ink-ghost); font-weight: 500; margin-left: 2px; }
.sl-page .cat-chevron { color: var(--ink-ghost); display: flex; align-items: center; font-size: 18px; transition: transform 0.18s; }
.sl-page .cat-group.open .cat-chevron { transform: rotate(180deg); }
.sl-page .cat-fields { display: none; }
.sl-page .cat-group.open .cat-fields { display: block; }

/* Field rows */
.sl-page .field-row {
  display: grid; grid-template-columns: minmax(0,1.1fr) 88px minmax(0,1fr) 76px 72px 84px 18px;
  gap: 20px; align-items: center; padding: 10px 16px; cursor: pointer;
  border-top: 1px solid var(--border-row); transition: background 0.1s;
}
@media (max-width: 900px) {
  .sl-page .field-row { grid-template-columns: minmax(0,1.2fr) 60px 50px 16px; gap: 8px; }
  .sl-page .field-row .field-path { display: none; }
  .sl-page .field-row .field-df { display: none; }
}
.sl-page .field-row:hover { background: var(--bg-subtle); }
.sl-page .field-row.expanded { background: var(--bg-panel); }
.sl-page .field-name { display: flex; align-items: center; min-width: 0; font-size: 14px; }
.sl-page .field-name-text { font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl-page .type-tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; white-space: nowrap; align-self: center; }
.sl-page .tag-dp { background: var(--bg-subtle); color: #6A6A7A; }
.sl-page .tag-sig { background: #FEF3E0; color: #92400E; }
html.dark .sl-page .tag-dp { background: #2a2a2a; color: #9A9AAA; }
html.dark .sl-page .tag-sig { background: #2d1e08; color: #d97706; }
.sl-page .field-path { font-family: ui-monospace, monospace; font-size: 13px; color: var(--purple); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sl-page .dt-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; font-family: ui-monospace, monospace; text-align: center; white-space: nowrap; }
.sl-page .dt-String { background: #FCE7E7; color: #991B1B; }
.sl-page .dt-Array { background: #EDE3FB; color: #6D28D9; }
.sl-page .dt-Boolean { background: #D1FAE5; color: #065F46; }
.sl-page .dt-Object { background: #FEF3E0; color: #92400E; }
.sl-page .dt-Number { background: #FEF9C3; color: #854D0E; }
html.dark .sl-page .dt-String { background: #2a0f0f; color: #f87171; }
html.dark .sl-page .dt-Array { background: #1e1535; color: #a78bfa; }
html.dark .sl-page .dt-Boolean { background: #0a2217; color: #34d399; }
html.dark .sl-page .dt-Object { background: #2a1a08; color: #fbbf24; }
html.dark .sl-page .dt-Number { background: #1e1800; color: #fde68a; }

.sl-page .field-df { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; white-space: nowrap; text-align: center; }
.sl-page .df-weekly { background: var(--purple-50); color: var(--purple); }
.sl-page .df-monthly { background: #FEF3E0; color: #D97706; }
.sl-page .df-none { background: var(--bg-subtle); color: var(--ink-ghost); font-weight: 400; }
html.dark .sl-page .df-monthly { background: #2a1a08; color: #fbbf24; }

.sl-page .field-chevron { color: var(--ink-ghost); display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
.sl-page .field-row.expanded .field-chevron { transform: rotate(180deg); color: #8A8A9A; }

/* Field detail */
.sl-page .field-detail { padding: 14px 16px 18px; background: var(--bg-panel); border-top: 1px solid var(--border-soft); display: none; }
.sl-page .field-row.expanded + .field-detail { display: block; }
.sl-page .detail-desc { font-size: 13px; color: #4A4A5A; line-height: 1.6; margin-bottom: 14px; max-width: 680px; }
html.dark .sl-page .detail-desc { color: var(--ink-dim); }
.sl-page .detail-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #B8B8C4; margin-bottom: 8px; }
html.dark .sl-page .detail-label { color: #5A5A6A; }

/* Endpoint chips */
.sl-page .ep-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sl-page .ep-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-family: ui-monospace, monospace; font-size: 11px; color: #5A4ABA; }
html.dark .sl-page .ep-chip { color: #a590ff; }
.sl-page .ep-chip-method { font-size: 9.5px; font-weight: 700; color: var(--purple); letter-spacing: 0.04em; }

/* Platform badges (detail) */
.sl-page .plat-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.sl-page .plat-badge { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 9px; border-radius: 7px; border: 1px solid var(--border); min-width: 72px; text-align: center; }
.sl-page .plat-badge-name { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9A9AAA; }
.sl-page .plat-badge-val { font-size: 10.5px; font-weight: 600; }
.sl-page .plat-live { background: #DCFCE7; border-color: #BBF7D0; }
.sl-page .plat-live .plat-badge-val { color: #166534; }
.sl-page .plat-planned { background: #FEF3E0; border-color: #FDE68A; }
.sl-page .plat-planned .plat-badge-val { color: #92400E; }
.sl-page .plat-ni { background: var(--bg-subtle); border-color: #E8E8F0; }
.sl-page .plat-ni .plat-badge-val { color: var(--ink-light); }
.sl-page .plat-irrel { background: var(--bg); border-color: var(--border-soft); }
.sl-page .plat-irrel .plat-badge-val { color: var(--ink-ghost); }
html.dark .sl-page .plat-live { background: #0a2e18; border-color: #166534; }
html.dark .sl-page .plat-live .plat-badge-val { color: #4ade80; }
html.dark .sl-page .plat-planned { background: #2d1e08; border-color: #92400e; }
html.dark .sl-page .plat-planned .plat-badge-val { color: #fbbf24; }
html.dark .sl-page .plat-ni { border-color: var(--border); }

.sl-page .field-empty { text-align: center; padding: 40px; font-size: 13px; color: var(--ink-ghost); background: var(--bg-subtle); }

/* Tooltip */
.sl-page .tip { position: relative; display: inline-flex; align-items: center; cursor: help; border-bottom: 1px dotted #B0B0C0; }
.sl-page .tip::after {
  content: attr(data-tip); position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%);
  background: #141414; color: #fff; font-size: 11px; font-weight: 400; line-height: 1.5;
  padding: 7px 11px; border-radius: 7px; white-space: normal; text-align: center; max-width: 220px;
  pointer-events: none; opacity: 0; transition: opacity 0.15s 0.1s; z-index: 200;
}
.sl-page .tip:hover::after { opacity: 1; }

/* Machine view */
.sl-page .machine-meta { display: flex; align-items: center; gap: 10px; padding: 10px 16px 14px; }
.sl-page .machine-meta-count { font-size: 12px; color: #B0B0BC; background: var(--bg-subtle); padding: 4px 10px; border-radius: 999px; }
.sl-page .machine-meta-text { font-size: 12px; color: var(--ink-muted); }
.sl-page .machine-wrap { border: 1px solid var(--border); border-radius: 0 0 12px 12px; overflow: auto; max-height: 70vh; }
.sl-page .machine-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.sl-page .machine-tbl thead tr { background: var(--bg-subtle); border-bottom: 1px solid var(--border); }
.sl-page .machine-tbl th { padding: 9px 11px; text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A9AAA; white-space: nowrap; position: sticky; top: 0; z-index: 2; background: var(--bg-subtle); box-shadow: 0 1px 0 var(--border); }
.sl-page .machine-tbl th:first-child { padding-left: 16px; }
.sl-page .machine-tbl td { padding: 8px 11px; border-bottom: 1px solid var(--border-row); vertical-align: middle; }
.sl-page .machine-tbl td:first-child { padding-left: 16px; }
.sl-page .machine-tbl tr:last-child td { border-bottom: none; }
.sl-page .machine-tbl tbody tr:hover td { background: var(--bg-subtle); }
.sl-page .mt-name { font-weight: 600; color: var(--ink); white-space: nowrap; font-size: 13px; }
.sl-page .mt-entity { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; white-space: nowrap; background: var(--bg-subtle); color: var(--ink-dim); }
.sl-page .mt-path { font-family: ui-monospace, monospace; font-size: 13px; color: var(--purple); white-space: nowrap; }
.sl-page .mt-desc { font-size: 13px; color: var(--ink-dim); line-height: 1.45; max-width: 280px; }
.sl-page .machine-empty { text-align: center; padding: 40px; font-size: 13px; color: var(--ink-ghost); }
.sl-page .mp-live { font-size: 10px; font-weight: 700; color: #166534; padding: 1px 5px; border-radius: 3px; background: #DCFCE7; display: inline-block; }
.sl-page .mp-plan { font-size: 10px; font-weight: 700; color: #92400E; padding: 1px 5px; border-radius: 3px; background: #FEF3E0; display: inline-block; }
.sl-page .mp-ni { font-size: 10px; color: var(--ink-ghost); }
.sl-page .mp-irrel { font-size: 10px; color: var(--ink-ghost); opacity: 0.5; }
html.dark .sl-page .mp-live { background: #0a2e18; color: #4ade80; }
html.dark .sl-page .mp-plan { background: #2d1e08; color: #fbbf24; }

.sl-loading { padding: 40px; text-align: center; color: #8B8B8B; font-family: -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="root" class="sl-loading">Loading Search Layer…</div>

<script>
(function () {
  // ---- theme sync (standalone: follow the visitor's OS preference) ----
  function applyTheme() {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  }
  applyTheme();
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  }

  var L = 'Live', P = 'Planned', N = 'Not Implemented', I = 'Irrelevant';
  var PLAT_LABELS = [
    { key: 'api', label: 'API', tip: null },
    { key: 'mcp', label: 'MCP', tip: null },
    { key: 'wsE', label: 'WS Enrich', tip: 'Workspace Enrichment' },
    { key: 'wsS', label: 'WS Search', tip: 'Workspace Search' },
    { key: 'apiS', label: 'API Search', tip: null },
  ];
  var CAT_ORDER = [
    'Contact identity', 'Emails & phones', 'Employment & seniority', 'LinkedIn enrichment',
    'Company firmographics', 'Company web & locations', 'Real-time signals',
  ];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function catOf(f) {
    if (f.tp === 'Signal') return 'Real-time signals';
    var n = f.n.toLowerCase();
    if (f.en === 'Contact') {
      if ((n.indexOf('email') !== -1 && n.indexOf('previous') === -1) || n.indexOf('phone') !== -1 || n.indexOf('do not call') !== -1) return 'Emails & phones';
      if (n.indexOf('award') !== -1 || n.indexOf('certification') !== -1 || n.indexOf('course') !== -1 || n === 'skills' || n.indexOf('connection count') !== -1 || n.indexOf('followers count') !== -1 || n === 'previous emails') return 'LinkedIn enrichment';
      if (n.indexOf('job') !== -1 || n === 'seniority' || n === 'department' || (n.indexOf('company') !== -1 && n.indexOf('previous') === -1)) return 'Employment & seniority';
      return 'Contact identity';
    }
    if (n.indexOf('hq ') === 0) return 'Company web & locations';
    if (n.indexOf('website') === 0 || n === 'logo url' || n === 'email domain') return 'Company web & locations';
    if (n.indexOf('locations') !== -1 && n.indexOf('by location') === -1) return 'Company web & locations';
    if (n.indexOf('linkedin url') !== -1 || n.indexOf('social link') !== -1) return 'Company web & locations';
    return 'Company firmographics';
  }

  function epsFor(f) {
    var base = f.en === 'Contact' ? 'contacts' : 'companies';
    if (f.tp === 'Data Point') {
      return [
        { method: 'POST', path: '/v3/' + base + '/search' },
        { method: 'POST', path: '/v3/' + base + '/enrich' },
        { method: 'POST', path: '/v3/' + base + '/search-and-enrich' },
        { method: 'POST', path: '/v3/' + base + '/prospecting' },
      ];
    }
    return [
      { method: 'POST', path: '/v3/' + base + '/signals' },
      { method: 'POST', path: '/v3/' + base + '/enrich' },
      { method: 'POST', path: '/v3/' + base + '/search-and-enrich' },
    ];
  }

  var CONTACT_PATH_MAP = {
    'emails[].email': 'emailAddresses[].email',
    'emails[].confidence': 'emailAddresses[].emailConfidence',
    'emails[].updateDate': 'emailAddresses[].updateDate',
    'phones[].number': 'phoneNumbers[].number',
    'phones[].doNotCall': 'phoneNumbers[].doNotCall',
    'phones[].updateDate': 'phoneNumbers[].updateDate',
    'location.isEuContact': 'location.is_eu_contact',
    'location.coordinates': 'location.location_coordinates',
    'previousEmployment[].company': 'previousJob.company.name',
  };

  function metaSchemaFor(f) {
    if (f.tp === 'Data Point' && f.en === 'Contact') {
      var p = CONTACT_PATH_MAP[f.pp] || f.pp;
      return [{ endpoint: '/v3/contacts/enrich', path: 'data.' + p }];
    }
    if (f.tp === 'Data Point' && f.en === 'Company') {
      return [
        { endpoint: '/v3/companies/enrich', path: f.pp },
        { endpoint: '/v3/contacts/enrich', path: 'company.' + f.pp },
      ];
    }
    if (f.tp === 'Signal' && f.en === 'Contact') {
      return [{ endpoint: '/v3/contacts/signals', path: 'contacts.{id}.' + f.pp + '[]' }];
    }
    if (f.tp === 'Signal' && f.en === 'Company') {
      return [{ endpoint: '/v3/companies/signals', path: 'companies.{id}.' + f.pp + '[]' }];
    }
    return [];
  }

  function platCellClass(s) { return s === L ? 'mp-live' : s === P ? 'mp-plan' : s === I ? 'mp-irrel' : 'mp-ni'; }
  function platCellText(s) { return s === L ? 'Live' : s === P ? 'Plan.' : s === I ? 'N/A' : '—'; }
  function platBadgeClass(s) { return s === L ? 'plat-live' : s === P ? 'plat-planned' : s === I ? 'plat-irrel' : 'plat-ni'; }
  function platBadgeText(s) { return s === L ? 'Live' : s === P ? 'Planned' : s === I ? 'N/A' : s === N ? 'Not impl.' : '—'; }

  var DATA = null;
  var state = { view: 'human', entity: 'all', type: 'all', query: '', openCats: {} };
  try { var saved = localStorage.getItem('sl-view'); if (saved === 'human' || saved === 'machine') state.view = saved; } catch (e) {}

  function filterFields() {
    var q = state.query.toLowerCase();
    return DATA.fields.filter(function (f) {
      if (q && f.n.toLowerCase().indexOf(q) === -1 && f.pp.toLowerCase().indexOf(q) === -1) return false;
      if (state.entity !== 'all' && f.en.toLowerCase() !== state.entity) return false;
      if (state.type !== 'all' && f.tp.replace(' ', '').toLowerCase() !== state.type) return false;
      return true;
    });
  }

  function renderFilterBar() {
    return '' +
      '<div class="filterbar">' +
        '<input type="text" class="search-input" id="sl-search" placeholder="Search field name or path…" value="' + esc(state.query) + '" />' +
        '<div class="chip-group"><span class="chip-label">Entity</span>' +
          '<button class="chip' + (state.entity === 'all' ? ' active' : '') + '" data-entity="all">All</button>' +
          '<button class="chip' + (state.entity === 'contact' ? ' active' : '') + '" data-entity="contact">Contact</button>' +
          '<button class="chip' + (state.entity === 'company' ? ' active' : '') + '" data-entity="company">Company</button>' +
        '</div>' +
        '<div class="chip-group"><span class="chip-label">Type</span>' +
          '<button class="chip' + (state.type === 'all' ? ' active' : '') + '" data-type="all">All</button>' +
          '<button class="chip' + (state.type === 'datapoint' ? ' active' : '') + '" data-type="datapoint">Static</button>' +
          '<button class="chip' + (state.type === 'signal' ? ' active' : '') + '" data-type="signal">Signal</button>' +
        '</div>' +
      '</div>';
  }

  function renderFieldDetail(f) {
    var pl = DATA.plat[f.n + '|' + f.en] || {};
    var badges = PLAT_LABELS.filter(function (p) { return pl[p.key] != null; }).map(function (p) {
      var s = pl[p.key];
      return '<div class="plat-badge ' + platBadgeClass(s) + (p.tip ? ' tip' : '') + '"' + (p.tip ? ' data-tip="' + esc(p.tip) + '"' : '') + '>' +
        '<span class="plat-badge-name">' + esc(p.label) + '</span><span class="plat-badge-val">' + esc(platBadgeText(s)) + '</span></div>';
    }).join('');
    var eps = epsFor(f).map(function (ep) {
      return '<span class="ep-chip"><span class="ep-chip-method">' + esc(ep.method) + '</span>' + esc(ep.path) + '</span>';
    }).join('');
    var schema = metaSchemaFor(f);
    var schemaHtml = '';
    if (schema.length) {
      schemaHtml = '<div class="detail-label" style="margin-top:14px">Metadata</div><div class="meta-rows">' +
        schema.map(function (m) {
          return '<div class="meta-row" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 0;border-bottom:1px solid var(--border-soft)">' +
            '<code class="meta-endpoint" style="font-family:ui-monospace,monospace;font-size:11px;font-weight:600;color:var(--purple);background:rgba(134,63,255,0.08);padding:2px 7px;border-radius:4px;white-space:nowrap">' + esc(m.endpoint) + '</code>' +
            '<code class="meta-path" style="font-family:ui-monospace,monospace;font-size:12px;color:var(--ink);flex:1;word-break:break-all">' + esc(m.path) + '</code>' +
            '<span class="dt-badge dt-' + esc(f.dt) + '">' + esc(f.dt) + '</span></div>';
        }).join('') + '</div>';
    }
    return '<div class="field-detail">' +
      '<p class="detail-desc">' + esc(f.d) + '</p>' +
      '<div class="detail-label">Platform availability</div><div class="plat-grid">' + badges + '</div>' +
      '<div class="detail-label">Available in</div><div class="ep-chips">' + eps + '</div>' +
      schemaHtml +
      '</div>';
  }

  function renderFieldRow(f) {
    var key = f.n + '|' + f.en;
    var fd = DATA.frData[key] || {};
    var dfLabel = fd.df || null;
    return '<div class="field-row" data-key="' + esc(key) + '">' +
      '<div class="field-name"><span class="field-name-text">' + esc(f.n) + '</span></div>' +
      '<span class="type-tag ' + (f.tp === 'Signal' ? 'tag-sig' : 'tag-dp') + '">' + (f.tp === 'Data Point' ? 'Static' : esc(f.tp)) + '</span>' +
      '<span class="field-path">' + esc(f.pp) + '</span>' +
      '<span class="dt-badge dt-' + esc(f.dt) + '">' + esc(f.dt) + '</span>' +
      '<span class="field-df df-' + (dfLabel ? dfLabel.toLowerCase() : 'none') + '">' + esc(dfLabel || '—') + '</span>' +
      '<span class="field-chevron">▾</span>' +
      '</div>' + renderFieldDetail(f);
  }

  function renderHuman(filtered) {
    var contactCount = DATA.fields.filter(function (f) { return f.en === 'Contact'; }).length;
    var companyCount = DATA.fields.filter(function (f) { return f.en === 'Company'; }).length;
    var signalCount = DATA.fields.filter(function (f) { return f.tp === 'Signal'; }).length;

    var grouped = {};
    CAT_ORDER.forEach(function (c) { grouped[c] = []; });
    filtered.forEach(function (f) { var c = catOf(f); if (grouped[c]) grouped[c].push(f); });

    var panelHtml;
    if (filtered.length === 0) {
      panelHtml = '<div class="field-empty">No fields match your filters.</div>';
    } else {
      panelHtml = CAT_ORDER.filter(function (c) { return grouped[c].length > 0; }).map(function (cat) {
        var open = state.openCats[cat] !== false;
        return '<div class="cat-group' + (open ? ' open' : '') + '" data-cat="' + esc(cat) + '">' +
          '<div class="cat-header"><span class="cat-chevron">▾</span><span class="cat-name">' + esc(cat) + ' <span class="cat-count-paren">(' + grouped[cat].length + ')</span></span></div>' +
          '<div class="cat-fields">' + grouped[cat].map(renderFieldRow).join('') + '</div>' +
        '</div>';
      }).join('');
    }

    return '' +
      '<div class="view">' +
        '<div class="desc-block">' +
          '<div class="desc-body">' +
            '<p>The Search Layer exposes two categories of data. <strong>Data Points</strong> are static, verified attributes — contact identity, employment history, emails, phones, and company firmographics. These are refreshed continuously and returned as structured JSON fields on every enrich or search response.</p>' +
            '<p><strong>Signals</strong> are event-driven triggers — headcount changes, job moves, promotions, hiring surges, website traffic shifts, and news events. Signals fire when something meaningful changes and can be polled or streamed depending on your plan.</p>' +
            '<p>Both types are available across the same four endpoints: <code>/search</code>, <code>/enrich</code>, <code>/search-and-enrich</code>, and <code>/prospecting</code> — for both contacts and companies.</p>' +
          '</div>' +
          '<div class="desc-sidebar">' +
            '<div class="desc-pill"><div class="desc-pill-text"><span class="desc-pill-title">Data Points</span><span class="desc-pill-sub">' + (contactCount + companyCount - signalCount) + ' static, verified attributes for contacts and companies. Returned on <code>/enrich</code> and <code>/search</code>.</span></div></div>' +
            '<div class="desc-pill"><div class="desc-pill-text"><span class="desc-pill-title">Signals</span><span class="desc-pill-sub">' + signalCount + ' real-time event triggers across contacts and companies. Polled via <code>/signals</code> or streamed on Pro+.</span></div></div>' +
            '<div class="desc-pill"><div class="desc-pill-text"><span class="desc-pill-title">One base URL</span><span class="desc-pill-sub">All endpoints at <code>https://api.lusha.com</code>, authenticated via <code>api_key</code> header.</span></div></div>' +
          '</div>' +
        '</div>' +
        '<div class="highlights">' +
          '<div class="highlight"><div class="hl-num">' + contactCount + '</div><div class="hl-label">Contact attributes</div><div class="hl-desc">Identity, emails, phones, employment, LinkedIn, location, and seniority, etc.</div></div>' +
          '<div class="highlight"><div class="hl-num">' + companyCount + '</div><div class="hl-label">Company firmographics</div><div class="hl-desc">Revenue, headcount, industry, locations, technographics, funding, and web presence, etc.</div></div>' +
          '<div class="highlight"><div class="hl-num">' + signalCount + '</div><div class="hl-label">Real-time signals</div><div class="hl-desc">Hiring surges, traffic shifts, news mentions, role changes, and IT spend trends, etc.</div></div>' +
          '<div class="highlight"><div class="hl-num">290M</div><div class="hl-label">Contacts</div><div class="hl-desc">Verified emails, direct dials, mobile numbers, job titles, and seniority, etc.</div></div>' +
          '<div class="highlight"><div class="hl-num">26M</div><div class="hl-label">Companies</div><div class="hl-desc">Industry, employee count, revenue, tech stack, and funding status, etc.</div></div>' +
        '</div>' +
        '<div class="table-sticky-header">' + renderFilterBar() +
          '<div class="field-col-header"><span>Field</span><span>Type</span><span>Path</span><span>Data&nbsp;type</span><span>Refresh</span><span></span></div>' +
        '</div>' +
        '<div class="field-panel">' + panelHtml + '</div>' +
      '</div>';
  }

  function renderMachine(filtered) {
    var platKeys = ['api', 'mcp', 'wsE', 'wsS', 'apiS'];
    var rows;
    if (filtered.length === 0) {
      rows = '<div class="machine-empty">No fields match your filters.</div>';
    } else {
      var body = filtered.map(function (f) {
        var key = f.n + '|' + f.en;
        var fd = DATA.frData[key] || {};
        var pl = DATA.plat[key] || {};
        var typeStyle = f.tp === 'Signal'
          ? 'background:#FEF3E0;color:#92400E'
          : 'background:var(--bg-subtle);color:var(--ink-dim)';
        var cells = platKeys.map(function (k) {
          var s = pl[k];
          if (s == null) return '<td></td>';
          return '<td style="text-align:center"><span class="' + platCellClass(s) + '">' + esc(platCellText(s)) + '</span></td>';
        }).join('');
        return '<tr>' +
          '<td class="mt-name">' + esc(f.n) + '</td>' +
          '<td><span class="mt-entity">' + esc(f.en) + '</span></td>' +
          '<td><span style="display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;' + typeStyle + '">' + (f.tp === 'Data Point' ? 'Static' : esc(f.tp)) + '</span></td>' +
          '<td class="mt-path">' + esc(f.pp) + '</td>' +
          '<td class="mt-desc">' + esc(f.d) + '</td>' +
          '<td><span class="dt-badge dt-' + esc(f.dt) + '">' + esc(f.dt) + '</span></td>' +
          '<td>' + (fd.df ? '<span style="font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg-subtle);color:var(--ink-dim)">' + esc(fd.df) + '</span>' : '<span style="color:var(--ink-ghost);font-size:11px">—</span>') + '</td>' +
          cells +
          '</tr>';
      }).join('');
      rows = '<table class="machine-tbl"><thead><tr>' +
        '<th>Field</th><th>Entity</th><th>Type</th><th>Path</th><th>Description</th><th>Data type</th><th>Refresh</th>' +
        '<th style="text-align:center">API</th><th style="text-align:center">MCP</th>' +
        '<th style="text-align:center"><span class="tip" data-tip="Workspace Enrichment">WS Enrich</span></th>' +
        '<th style="text-align:center"><span class="tip" data-tip="Workspace Search">WS Search</span></th>' +
        '<th style="text-align:center">API Search</th>' +
        '</tr></thead><tbody>' + body + '</tbody></table>';
    }
    return '<div class="view">' +
      '<div class="table-sticky-header">' + renderFilterBar() + '</div>' +
      '<div class="machine-meta"><span class="machine-meta-count">' + filtered.length + ' fields</span><span class="machine-meta-text">All fields flat, one row per field.</span></div>' +
      '<div class="machine-wrap">' + rows + '</div>' +
      '</div>';
  }

  function render() {
    var filtered = filterFields();
    var body = state.view === 'human' ? renderHuman(filtered) : renderMachine(filtered);
    var html = '<div class="sl-page">' +
      '<div class="sl-header">' +
        '<span class="sl-eyebrow-row">Search Layer</span>' +
        '<div class="view-toggle" role="group" aria-label="View mode">' +
          '<button class="vtog-btn' + (state.view === 'human' ? ' active' : '') + '" data-view="human">Human</button>' +
          '<button class="vtog-btn' + (state.view === 'machine' ? ' active' : '') + '" data-view="machine">Machine</button>' +
        '</div>' +
      '</div>' +
      '<div class="hero">' +
        '<div class="eyebrow">Search Layer</div>' +
        '<h1>Contact, Company Data, &amp; Signals</h1>' +
        '<p class="lead">The Search Layer is Lusha\'s core data API — ' + (DATA.fields.length - DATA.fields.filter(function (f) { return f.tp === 'Signal'; }).length) + ' verified contact and company fields plus real-time buying signals, all accessible through a single set of v3 endpoints. Use it to search, enrich, and prospect at scale.</p>' +
      '</div>' +
      body +
    '</div>';
    document.getElementById('root').className = '';
    document.getElementById('root').innerHTML = html;
    wireEvents();
    resizeParent();
  }

  function wireEvents() {
    var root = document.getElementById('root');
    var searchInput = root.querySelector('#sl-search');
    if (searchInput) {
      searchInput.addEventListener('input', function (e) {
        state.query = e.target.value;
        render();
        var el = document.getElementById('sl-search');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }
    root.querySelectorAll('[data-view]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.view = btn.getAttribute('data-view');
        try { localStorage.setItem('sl-view', state.view); } catch (e) {}
        render();
      });
    });
    root.querySelectorAll('[data-entity]').forEach(function (btn) {
      btn.addEventListener('click', function () { state.entity = btn.getAttribute('data-entity'); render(); });
    });
    root.querySelectorAll('[data-type]').forEach(function (btn) {
      btn.addEventListener('click', function () { state.type = btn.getAttribute('data-type'); render(); });
    });
    root.querySelectorAll('.cat-header').forEach(function (h) {
      h.addEventListener('click', function () {
        var group = h.closest('.cat-group');
        var cat = group.getAttribute('data-cat');
        var open = group.classList.contains('open');
        state.openCats[cat] = !open;
        group.classList.toggle('open', !open);
        resizeParent();
      });
    });
    root.querySelectorAll('.field-row').forEach(function (row) {
      row.addEventListener('click', function () {
        row.classList.toggle('expanded');
        resizeParent();
      });
    });
  }

  function resizeParent() {
    // let the iframe grow to fit content when embedded with the companion resize script
    try {
      var h = document.documentElement.scrollHeight;
      window.parent.postMessage({ type: 'lusha-widget-resize', height: h }, '*');
    } catch (e) {}
  }

  try {
    DATA = JSON.parse(document.getElementById('sl-data').textContent);
    render();
  } catch (err) {
    document.getElementById('root').innerHTML = '<div class="sl-loading">Could not load Search Layer data (' + esc(err.message) + ').</div>';
  }

  window.addEventListener('resize', resizeParent);
})();
</script>
</body>
</html>
